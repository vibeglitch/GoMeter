name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go:
    name: Test Go Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Run Unit Tests
        run: go test -v -mod=vendor ./pkg/... ./mcp/...

      - name: Build GoMeter Binary
        run: go build -v -mod=vendor -ldflags="-s -w" -o bin/gometer ./cmd/gometer

      - name: Validate Example Test Plans
        run: |
          ./bin/gometer validate examples/data/real-dummy-apis.gometer.yaml
          ./bin/gometer validate examples/data/high-concurrency.gometer.yaml
        if: runner.os != 'Windows'

  test-extension:
    name: Test & Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'vscode-extension/package-lock.json'

      - name: Install Extension Dependencies
        run: cd vscode-extension && npm ci

      - name: Build Extension Bundle
        run: cd vscode-extension && npm run build
