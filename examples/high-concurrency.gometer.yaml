name: "High-Concurrency E-Commerce Flow"
description: "50 Concurrent Virtual Users executing chained API authentication, browsing, and order placement"
base_url: "http://127.0.0.1:18090"

variables:
  csv:
    - name: users
      file: "./data/users.csv"
      delimiter: ","

defaults:
  headers:
    Content-Type: "application/json"
    Accept: "application/json"
  timeout: 5s

scenarios:
  - name: "Customer Checkout Journey"
    virtual_users: 50
    duration: 5s
    ramp_up: 1s
    think_time: 10ms
    requests:
      - name: "1. Login User"
        method: POST
        path: "/api/auth/login"
        body: '{"username": "${username}", "password": "${password}"}'
        assertions:
          - type: status
            expected: "200"
          - type: body_json
            path: "$.status"
            expected: "authenticated"
        extract:
          - name: auth_token
            source: body_json
            path: "$.token"

      - name: "2. Fetch Products"
        method: GET
        path: "/api/products"
        assertions:
          - type: status
            expected: "200"
          - type: body_contains
            expected: "Mechanical Keyboard"
          - type: latency
            expected: "<50ms"

      - name: "3. Submit Order"
        method: POST
        path: "/api/orders"
        headers:
          Authorization: "Bearer ${auth_token}"
        body: '{"item": "Mechanical Keyboard", "quantity": 1, "price": 120.00}'
        assertions:
          - type: status
            expected: "201"
          - type: body_json
            path: "$.status"
            expected: "confirmed"

      - name: "4. Query Details"
        method: GET
        path: "/api/slow?ms=5"
        assertions:
          - type: status
            expected: "200"
          - type: latency
            expected: "<50ms"

    thresholds:
      - metric: p95_latency
        operator: "<"
        value: 50
        unit: ms
      - metric: error_rate
        operator: "<"
        value: 1.0
        unit: "%"

