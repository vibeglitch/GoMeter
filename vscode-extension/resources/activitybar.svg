<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Outer Speedometer Arc (transparent background for VS Code Activity Bar) -->
  <path d="M 6 18 A 8.5 8.5 0 1 1 18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Needle pointing at high performance load (45 degrees) -->
  <path d="M 12 12 L 16.2 7.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Center Pivot Hub -->
  <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
  <!-- Calibration Ticks -->
  <line x1="12" y1="3.5" x2="12" y2="5.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="6" y1="6" x2="7.6" y2="7.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="18" y1="6" x2="16.4" y2="7.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
