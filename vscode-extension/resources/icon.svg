<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Speed Arc Gradient -->
    <linearGradient id="speedGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="25%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#3b82f6"/>
      <stop offset="90%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Needle Shading -->
    <linearGradient id="needleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="needleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Center Hub Radial Glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Squircle Card -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Inner Ambient Radial Glow -->
  <circle cx="256" cy="256" r="210" fill="#38bdf8" opacity="0.04" filter="url(#glow)"/>

  <!-- Gauge Base Inactive Track -->
  <path d="M 143 369 A 160 160 0 1 1 369 369" fill="none" stroke="#1e293b" stroke-width="26" stroke-linecap="round"/>

  <!-- Gauge Active Speed Gradient Arc -->
  <path d="M 143 369 A 160 160 0 1 1 378 200" fill="none" stroke="url(#speedGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Dial Tick Marks -->
  <!-- 135 deg -->
  <line x1="124" y1="388" x2="140" y2="372" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- 165 deg -->
  <line x1="84" y1="305" x2="103" y2="300" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- 180 deg (Major) -->
  <line x1="72" y1="256" x2="96" y2="256" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- 195 deg -->
  <line x1="84" y1="207" x2="103" y2="212" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- 225 deg (Major) -->
  <line x1="124" y1="124" x2="141" y2="141" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- 255 deg -->
  <line x1="207" y1="84" x2="212" y2="103" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- 270 deg (Major Peak) -->
  <line x1="256" y1="72" x2="256" y2="96" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
  <!-- 285 deg -->
  <line x1="305" y1="84" x2="300" y2="103" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- 315 deg (Major Overdrive) -->
  <line x1="388" y1="124" x2="371" y2="141" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- 345 deg -->
  <line x1="428" y1="207" x2="409" y2="212" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  <!-- 0 deg (Redline) -->
  <line x1="440" y1="256" x2="416" y2="256" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
  <!-- 15 deg -->
  <line x1="428" y1="305" x2="409" y2="300" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  <!-- 45 deg -->
  <line x1="388" y1="388" x2="371" y2="372" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- High Velocity Precision Needle (Surging at ~320 degrees) -->
  <g filter="url(#glow)">
    <!-- Right Facet (Bright Specular) -->
    <polygon points="256,256 390,144 267,267" fill="url(#needleLight)"/>
    <!-- Left Facet (Electric Cyan) -->
    <polygon points="256,256 390,144 245,245" fill="url(#needleCyan)"/>
    <!-- Counterweight -->
    <polygon points="256,256 220,292 235,307" fill="#0f172a"/>
  </g>

  <!-- Center Hub Assembly -->
  <circle cx="256" cy="256" r="42" fill="#0b0f19" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="256" cy="256" r="26" fill="url(#hubGlow)"/>
  <circle cx="256" cy="256" r="14" fill="#38bdf8"/>
  <circle cx="251" cy="251" r="5" fill="#ffffff" opacity="0.8"/>

  <!-- Sleek Speedometer "G" Monogram Sub-Dial Accent -->
  <path d="M 232 400 L 280 400 A 24 24 0 0 0 304 376 L 304 364 L 270 364" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
